# Claude Code 语音输入触发器配置文件

# ===========================================
# Whisper 服务配置
# ===========================================
whisper:
  # API 地址（使用本地 Whisper 服务）
  api_url: "http://localhost:8765/v1/audio/transcriptions"

  # 语言设置
  # zh: 中文, en: 英文, auto: 自动检测
  language: "zh"

# ===========================================
# 音频录制配置
# ===========================================
audio:
  # 采样率（Hz）
  # Whisper 推荐 16000
  sample_rate: 16000

  # 声道数
  # 1: 单声道（推荐）, 2: 立体声
  channels: 1

  # 音频块时长（毫秒）
  # 用于 VAD 检测，推荐 30ms
  chunk_duration_ms: 30

  # 静音填充时长（毫秒）
  # 在检测到的语音前后添加的静音缓冲
  padding_duration_ms: 300

# ===========================================
# VAD (语音活动检测) 配置
# ===========================================
vad:
  # VAD 模式
  # 0: 最宽松（容易误触发）
  # 1: 宽松
  # 2: 中等（推荐）
  # 3: 最严格（减少误触发，适合嘈杂环境）
  mode: 3

  # 连续静音阈值（秒）
  # 检测到此时长的静音后停止录音
  silence_threshold: 1.5

  # 最短录音时长（秒）
  # 避免录音时间太短导致无效
  min_recording_seconds: 0.5

  # 最长录音时长（秒）
  # 防止录音时间过长
  max_recording_seconds: 60

# ===========================================
# 键盘输入配置
# ===========================================
keyboard:
  # 每个字符输入延迟（秒）
  # 0: 无延迟（最快）
  # 0.01: 轻微延迟（推荐，更自然）
  # 0.02: 明显延迟（兼容性更好）
  typing_delay: 0.01

  # 是否自动按 Enter 提交
  # true: 输入完成后自动按 Enter
  # false: 只输入文本，不提交
  auto_submit: true

  # 输入前等待时间（秒）
  # 确保焦点在正确的窗口
  pre_typing_delay: 0.2

# ===========================================
# 日志配置
# ===========================================
logging:
  # 日志级别
  # DEBUG: 详细调试信息
  # INFO: 一般信息（推荐）
  # WARNING: 警告信息
  # ERROR: 错误信息
  level: "INFO"

  # 日志文件路径（相对于项目根目录）
  file: "logs/voice_input.log"

# ===========================================
# 高级配置
# ===========================================
advanced:
  # 是否保存录音文件（用于调试）
  save_audio: false

  # 录音文件保存目录
  audio_save_dir: "logs/recordings"

  # API 请求超时（秒）
  api_timeout: 30
